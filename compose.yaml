name: auto24
services:
  storage:
    build:
      context: .
      additional_contexts:
        captcha_solver: ${HOME}/.cache/auto24/captcha-solver/current
    image: auto24-extraction-service:compose
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["auto24_service.storage_api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      TURSO_DB_PATH: /data/auto24.db
      LIVE_DIAGNOSTICS_ENABLED: ${LIVE_DIAGNOSTICS_ENABLED:-false}
    volumes:
      - turso_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      additional_contexts:
        captcha_solver: ${HOME}/.cache/auto24/captcha-solver/current
    image: auto24-extraction-service:compose
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["auto24_service.public_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:?Set PUBLIC_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      STORAGE_URL: http://storage:8001
      BACKGROUND_CHECK_DIR: /data/background-checks
    volumes:
      - background_checks:/data/background-checks:ro
    ports:
      - "${API_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker-auto24:
    container_name: worker-auto24
    build:
      context: .
      dockerfile: Dockerfile.chromium
      additional_contexts:
        browser_assets: ${HOME}/.cache/auto24/browser-assets
    image: auto24-extraction-service:chromium
    entrypoint: ["python", "-m", "auto24_service.worker"]
    environment:
      CAPTURE_ENGINE: ${CAPTURE_ENGINE:-chromium}
      CHROMIUM_LOOKUPS: ${CHROMIUM_LOOKUPS:-false}
      CHROMIUM_WARM_PROFILE: ${CHROMIUM_WARM_PROFILE:-false}
      CHROMIUM_HEADLESS: ${CHROMIUM_HEADLESS:-false}
      AUTO24_ENV: ${AUTO24_ENV:-production}
      REVEAL_FORCE_FAILURE: ${REVEAL_FORCE_FAILURE:-false}
      CAPTCHA_LOOKUP_ENABLED: ${CAPTCHA_LOOKUP_ENABLED:-false}
      LIVE_DIAGNOSTICS_ENABLED: ${LIVE_DIAGNOSTICS_ENABLED:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      STORAGE_URL: http://storage:8001
      BACKGROUND_CHECK_DIR: /data/background-checks
    volumes:
      - background_checks:/data/background-checks
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'auto24_service.worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  background-checks-init:
    image: auto24-extraction-service:invisible
    user: "0"
    entrypoint: ["chown", "10001:10001", "/data/background-checks"]
    volumes:
      - background_checks:/data/background-checks

  worker-mnt:
    container_name: worker-mnt
    build:
      context: .
      dockerfile: Dockerfile.invisible
      target: runtime
    image: auto24-extraction-service:invisible
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      STORAGE_URL: http://storage:8001
      BACKGROUND_CHECK_DIR: /data/background-checks
    volumes:
      - background_checks:/data/background-checks
    extra_hosts:
      api.ipify.org: "0.0.0.0"
      icanhazip.com: "0.0.0.0"
      checkip.amazonaws.com: "0.0.0.0"
    depends_on:
      storage:
        condition: service_healthy
      background-checks-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'auto24_service.lookup_worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker-camoufox:
    profiles: ["camoufox"]
    build:
      context: .
      additional_contexts:
        captcha_solver: ${HOME}/.cache/auto24/captcha-solver/current
    image: auto24-extraction-service:compose
    entrypoint: ["python", "-m", "auto24_service.worker"]
    environment:
      CAPTURE_ENGINE: camoufox
      AUTO24_ENV: ${AUTO24_ENV:-production}
      REVEAL_FORCE_FAILURE: ${REVEAL_FORCE_FAILURE:-false}
      CAPTCHA_LOOKUP_ENABLED: ${CAPTCHA_LOOKUP_ENABLED:-false}
      LIVE_DIAGNOSTICS_ENABLED: ${LIVE_DIAGNOSTICS_ENABLED:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      STORAGE_URL: http://storage:8001
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'auto24_service.worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  turso_data:
  # Background check PDFs: the worker writes them, the API serves them read-only.
  background_checks:
