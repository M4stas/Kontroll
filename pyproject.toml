[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto24-extraction-service"
version = "0.1.0"
description = "Asynchronous Auto24 listing extraction service"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
