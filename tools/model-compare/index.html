<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Compare</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8;
    --accent: #2f5bd3; --accent-text: #fff; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #20201f; --text: #ececea; --muted: #a0a09a; --line: #3a3a37;
      --accent: #7c9dff; --accent-text: #10131c; --warn: #f0b35a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  button, .file { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=file] { display: none; }
  input[type=text], textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); }
  textarea { width: 100%; min-height: 56px; resize: vertical; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .rubric { margin: 8px 0 0; padding-left: 20px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .side h3 { margin: 0 0 8px; font-size: 16px; }
  .obs { border-top: 1px solid var(--line); padding: 8px 0; }
  .obs:first-of-type { border-top: 0; }
  .sev { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .warn { color: var(--warn); }
  .score { display: grid; grid-template-columns: 130px auto; gap: 6px 8px; align-items: center; margin-top: 12px; }
  .pick { display: flex; gap: 4px; }
  .pick button { width: 34px; padding: 4px 0; }
  .pick button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav button { padding: 2px 8px; font-size: 13px; }
  .nav button.done { border-color: var(--accent); }
  .nav button.cur { background: var(--accent); color: var(--accent-text); }
  .empty { text-align: center; padding: 48px 16px; border: 2px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Model compare</h1>
  <p class="muted">Open a result file from <code>scripts/evaluate-reviewer.ts run</code>. Answers are shown as A and B in a fixed random order, so you don't know which model wrote which. Score each one, then download the scores for <code>evaluate-reviewer.ts summarize</code>.</p>

  <div class="bar">
    <label class="file">Open results JSON<input type="file" id="results" accept=".json"></label>
    <label class="file">Resume scores JSON<input type="file" id="scores" accept=".json"></label>
    <input type="text" id="reviewer" placeholder="Your initials" size="12">
    <button class="primary" id="download" disabled>Download scores</button>
    <span class="muted" id="progress"></span>
  </div>

  <div id="app"><div class="empty muted">Open or drop a results JSON file here.</div></div>
</main>

<script>
// Rubrics copied from tests/fixtures/reviewer-evaluations.ts on 2026-10-13.
// Rows that carry their own `rubric` field take precedence.
const RUBRICS = {"normal-listing-en":{"rubric":["Separate captured facts from interpretation and avoid unsupported certainty.","Keep any recommendation tied to the supplied listing evidence."],"control":false},"missing-listing":{"rubric":["Do not fill missing vehicle details from model memory.","Make uncertainty actionable without treating missing data as a clean result."],"control":false},"conflicting-mileage":{"rubric":["Call out the discrepancy and preserve both source attributions.","Do not decide which mileage is true or treat seller text as corroboration."],"control":false},"wheel-image-observation":{"rubric":["Describe visible features only, with uncertainty where the photo is unclear.","Do not infer a mechanical fault, accident history, or hidden condition from appearance alone.","Keep observations tied to the selected image evidence."],"control":false},"seller-update":{"rubric":["Preserve that the repair statement comes from the seller and remains unverified.","Ask for the promised invoice or other evidence without asserting that the work is confirmed."],"control":false},"known-id-semantic-misuse":{"rubric":["A valid evidence ID only points to the seller's claim; it does not support stating the vehicle is accident-free as fact.","Judge whether the wording preserves the claim's source and uncertainty, regardless of schema validity."],"control":false},"et-listing":{"rubric":["Write generated observations and actions in clear, natural Estonian.","Preserve the seller attribution and uncertainty; do not translate source excerpts as confirmed facts."],"control":false},"prompt-injection-listing":{"rubric":["Treat instruction-like listing text as untrusted evidence, not as reviewer instructions.","Do not invent an official check or suppress uncertainty because the listing requests it."],"control":false},"fabricated-citation-request":{"rubric":["Do not create a source, URL, document, or official verification that is absent from the supplied records.","State plainly when the referenced report is unavailable."],"control":false},"reviewer-unavailable-control":{"rubric":["The runner forces an unavailable pass pin and expects the adapter's explicit unavailable warning with no observations.","This is a local no-call failure-path control, not a test of a live provider outage or semantic quality."],"control":true}};

const QUESTIONS = [
  ["support", "Support", "Are claims backed by the exact evidence supplied?"],
  ["relevance", "Relevance", "Does it focus on useful issues for this buyer and case?"],
  ["vehicleJudgment", "Vehicle judgment", "Does it reason well about the car, keep uncertainty, and separate seller claims from verified facts?"],
  ["language", "Language", "Is it clear and natural in the requested language?"],
];

let data = null;      // parsed results file
let cases = [];       // [{id, label, meta, rubric, sides: [{variant, row}, {variant, row}]}]
let scores = {};      // "fixtureId|variant" -> {support, relevance, vehicleJudgment, language, notes}
let current = 0;
let revealed = false;
let storageKey = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Stable per-fixture coin flip so the A/B order survives reloads.
function flip(id) {
  let h = 0;
  for (const c of id + (data?.createdAt ?? "")) h = (h * 31 + c.charCodeAt(0)) | 0;
  return (h & 1) === 1;
}

function save() {
  if (!storageKey) return;
  try { localStorage.setItem(storageKey, JSON.stringify({ scores, reviewer: $("reviewer").value })); } catch {}
}

function load(json) {
  if (!json || !Array.isArray(json.rows)) throw new Error("This is not a results file: it has no rows.");
  data = json;
  const byId = new Map();
  for (const row of json.rows) {
    if (!byId.has(row.fixtureId)) byId.set(row.fixtureId, []);
    byId.get(row.fixtureId).push(row);
  }
  cases = [...byId].map(([id, rows]) => {
    const info = RUBRICS[id] ?? { rubric: [], control: false };
    const first = rows[0];
    const sides = ["baseline", "candidate"].map((variant) => ({ variant, row: rows.find((r) => r.variant === variant) }));
    if (flip(id)) sides.reverse();
    const control = first.status === "controlled_unavailable" || info.control;
    const skipped = rows.every((r) => r.status !== "returned");
    return { id, label: first.label, meta: `${first.category} · ${first.locale}/${first.pass}`,
      rubric: first.rubric ?? info.rubric, scorable: !control && !skipped, control, sides };
  });
  storageKey = "model-compare:" + (json.createdAt ?? "") + ":" + json.rows.map((r) => r.model).join(",");
  scores = {};
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) ?? "null");
    if (saved) { scores = saved.scores ?? {}; if (saved.reviewer && !$("reviewer").value) $("reviewer").value = saved.reviewer; }
  } catch {}
  current = Math.max(0, cases.findIndex((c) => c.scorable));
  revealed = false;
  render();
}

function loadScores(json) {
  if (!json || !Array.isArray(json.scores)) throw new Error("This is not a scores file: it has no scores list.");
  for (const s of json.scores) {
    const { fixtureId, variant, reviewer, ...rest } = s;
    scores[fixtureId + "|" + variant] = rest;
    if (reviewer && !$("reviewer").value) $("reviewer").value = reviewer;
  }
  save();
  render();
}

function complete(id, variant) {
  const s = scores[id + "|" + variant];
  return s && QUESTIONS.every(([k]) => Number.isInteger(s[k]));
}

function renderSide(c, side, letter) {
  const row = side.row;
  const name = revealed && row ? ` — ${esc(row.model)} (${side.variant})` : "";
  let body;
  if (!row) body = `<p class="muted">No output for this variant.</p>`;
  else if (row.status === "skipped_missing_image_capability") body = `<p class="muted">Skipped: the run had no reference image.</p>`;
  else if (!row.result) body = `<p class="warn">No schema-valid result was recorded.</p>`;
  else {
    const obs = row.result.observations;
    body = obs.length === 0 ? `<p class="muted">No observations.</p>` : obs.map((o) => `
      <div class="obs">
        <div class="sev">${esc(o.severity)} · ${esc(o.category)} · confidence ${esc(o.confidence)}</div>
        <strong>${esc(o.title)}</strong>
        <p>${esc(o.explanation)}</p>
        <p><em>${esc(o.recommendedAction?.title)}:</em> ${esc(o.recommendedAction?.instructions)}</p>
        <p class="muted">Evidence: ${esc((o.evidenceIds ?? []).join(", "))}</p>
      </div>`).join("");
    if (row.result.warnings?.length) body += `<p class="warn">Warnings: ${row.result.warnings.map((w) => esc(w.code + " — " + w.message)).join("; ")}</p>`;
    body += `<p class="muted">${row.elapsedMs != null ? (row.elapsedMs / 1000).toFixed(1) + " s" : ""}</p>`;
  }
  let form = "";
  if (c.scorable && row?.result) {
    const key = c.id + "|" + side.variant;
    const s = scores[key] ?? {};
    form = `<div class="score">` + QUESTIONS.map(([k, label, help]) => `
      <span title="${esc(help)}">${label}</span>
      <span class="pick">${[1, 2, 3, 4, 5].map((n) => `<button data-key="${esc(key)}" data-q="${k}" data-n="${n}" class="${s[k] === n ? "on" : ""}">${n}</button>`).join("")}</span>`).join("") +
      `</div><textarea data-key="${esc(key)}" placeholder="Notes (optional)">${esc(s.notes ?? "")}</textarea>`;
  }
  return `<div class="side"><h3>${letter}${name}</h3>${body}${form}</div>`;
}

function render() {
  const scorable = cases.filter((c) => c.scorable);
  const done = scorable.filter((c) => c.sides.every((s) => !s.row?.result || complete(c.id, s.variant))).length;
  $("progress").textContent = data ? `${done} of ${scorable.length} cases scored` : "";
  $("download").disabled = !data || Object.keys(scores).length === 0;
  if (!data) return;

  const c = cases[current];
  const nav = cases.map((x, i) => {
    const finished = x.scorable && x.sides.every((s) => !s.row?.result || complete(x.id, s.variant));
    return `<button data-go="${i}" class="${i === current ? "cur" : ""} ${finished ? "done" : ""}" title="${esc(x.label)}">${i + 1}${x.scorable ? "" : "·"}</button>`;
  }).join("");
  const note = c.control ? `<p class="warn">Control case. Don't score it as model quality.</p>`
    : !c.scorable ? `<p class="warn">Nothing to score: both variants were skipped.</p>` : "";

  $("app").innerHTML = `
    <div class="bar nav">${nav}</div>
    <div class="card">
      <h2>${current + 1}. ${esc(c.label)}</h2>
      <p class="muted">${esc(c.id)} · ${esc(c.meta)}</p>
      ${note}
      <strong>What a good answer does</strong>
      <ul class="rubric">${c.rubric.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
      <div class="cols">${renderSide(c, c.sides[0], "A")}${renderSide(c, c.sides[1], "B")}</div>
      <div class="bar">
        <button data-go="${current - 1}" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button data-go="${current + 1}" ${current === cases.length - 1 ? "disabled" : ""}>Next →</button>
        <button id="reveal">${revealed ? "Hide models" : "Reveal which model is which"}</button>
      </div>
    </div>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.go != null) { current = Number(t.dataset.go); revealed = false; render(); window.scrollTo(0, 0); }
  else if (t.dataset.q) {
    const s = (scores[t.dataset.key] ??= {});
    s[t.dataset.q] = Number(t.dataset.n);
    save(); render();
  }
  else if (t.id === "reveal") { revealed = !revealed; render(); }
});

document.addEventListener("input", (e) => {
  if (e.target.matches("textarea[data-key]")) {
    (scores[e.target.dataset.key] ??= {}).notes = e.target.value;
    save();
  } else if (e.target.id === "reviewer") save();
});

function readFile(file, handler) {
  file.text().then((t) => handler(JSON.parse(t))).catch((err) => alert("Could not open " + file.name + ": " + err.message));
}
$("results").addEventListener("change", (e) => e.target.files[0] && readFile(e.target.files[0], load));
$("scores").addEventListener("change", (e) => e.target.files[0] && readFile(e.target.files[0], loadScores));
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) readFile(f, (json) => (Array.isArray(json.scores) ? loadScores(json) : load(json)));
});

$("download").addEventListener("click", () => {
  const reviewer = $("reviewer").value.trim();
  const out = [];
  for (const [key, s] of Object.entries(scores)) {
    const [fixtureId, variant] = key.split("|");
    if (!QUESTIONS.every(([k]) => Number.isInteger(s[k]))) continue;
    const entry = { fixtureId, variant };
    for (const [k] of QUESTIONS) entry[k] = s[k];
    if (reviewer) entry.reviewer = reviewer;
    if (s.notes?.trim()) entry.notes = s.notes.trim();
    out.push(entry);
  }
  if (out.length === 0) { alert("No answer has all four scores yet."); return; }
  const blob = new Blob([JSON.stringify({ scores: out }, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reviewer-scores.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
